name: Build

# 公開せずにパイプラインと dbt build だけを回す。配布元の RDF の形が変わったときに
# Sync より先に気づくため
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run python -c "import logging; logging.basicConfig(level=logging.INFO, format='%(message)s'); from pipelines.imi import download_imi; download_imi()"
      - run: uv run dbt build --profiles-dir ci
      - run: uv run python -c "import duckdb; c = duckdb.connect('target/imi.duckdb'); print(c.sql('select kind, count(*) from vocab.term group by all')); print(c.sql(\"select * from vocab.term where name in ('住所型', '住所', '表記', '緯度', '市区町村コード')\"))"
