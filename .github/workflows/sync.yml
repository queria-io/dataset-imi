name: Apply

on:
  push:
    branches: [main]
  schedule:
    # 毎年 1 月 3 日 05:00 JST。コア語彙は 2019 年の 2.4.2 から更新が無く、
    # 配布元が消えたり変わったりしていないかを確かめる程度に回す
    - cron: "0 20 2 1 *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う。
    # contents と pull-requests は、Queria で変更された説明をこのリポジトリに戻す PR に使う
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@252f25b5f027b83c61e265125e7557259135e8e7
    with:
      dataset_name: imi
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
