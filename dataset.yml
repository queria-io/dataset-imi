spec_version: "0.1"
name: imi
title: IMI 共通語彙基盤 コア語彙
description: |-
  IMI（情報共有基盤）共通語彙基盤のコア語彙 2.4.2。住所・施設・組織・人などを記述するための語（クラスとプロパティ）を、恒久的な URI・ラベル・説明・定義域・値域とともに持つ。
  コア語彙は 2019 年の 2.4.2 が最後の版で、それ以降は更新されていない。デジタル庁の政府相互運用性フレームワーク（gif データセット）は、多くの項目でこの語彙を参考元にしている。列や項目の意味を URI で指したいとき、GIF の項目の元になった語を確かめたいときに使う。

  出典: IMI 情報共有基盤 共通語彙基盤 コア語彙 2.4.2（https://imi.go.jp/core/core242/）。
  Queria が配布されている RDF スキーマ（schema_rdf.zip の Turtle）を、語ごとに 1 行の表と、クラスが持てるプロパティの表に変換して作成した。
