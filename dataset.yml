# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・列の意味）は annotations.queria に書く。
name: imi
title: IMI 共通語彙基盤 コア語彙
description: |-
  IMI 共通語彙基盤のコア語彙 2.4.2 です。住所・施設・組織・人などを記述するための語（クラスとプロパティ）を、URI・ラベル・説明・定義域・値域とともに収録しています。

  出典：IMI 情報共有基盤 共通語彙基盤 コア語彙 2.4.2。Queria が加工したものです。
keywords:
  - 語彙
  - メタデータ
  - データ標準
  - 共通語彙
  - IMI
  - 共通語彙基盤
  - RDF
homepage: https://github.com/queria-io/dataset-imi
language: ja

licenses:
  - CC0-1.0

sources:
  - title: IMI 共通語彙基盤 コア語彙 2.4.2
    path: https://imi.go.jp/core/core242/

contributors:
  - title: IMI 情報共有基盤
    path: https://imi.go.jp/
    roles: [rightsHolder]

spatial_coverage: [JP]
update_frequency: irregular

schemas:
  - name: vocab
    title: 語彙

annotations:
  queria:
    themes: [other]
    cover: 📘
...
