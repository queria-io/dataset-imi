schema: vocab
name: class_property
title: クラスとプロパティ
description: |-
  IMI コア語彙で、クラスが持てるプロパティです。1 行がクラスとプロパティの組で、値の型と最大の個数を持ちます。

  - 上位のクラスから受け継ぐプロパティは、上位のクラスの行にだけあります
sources:
  - path: https://imi.go.jp/core/core242/
fields:
  - name: version
    title: バージョン
  - name: class_name
    title: クラス
    description: "ic:住所型 のような短い形"
  - name: property_name
    title: プロパティ
  - name: value_type
    title: 値の型
    description: クラス（ic:コード型 など）かデータ型（xsd:string など）
  - name: max_cardinality
    title: 最大の個数
    description: 持てる値の最大数。NULL は上限なし
