schema: vocab
name: term
title: コア語彙の語
description: IMI 共通語彙基盤のコア語彙 2.4.2 の語。1行が1語で、クラス（住所型、施設型など「〜型」）とプロパティ（住所、表記、緯度など）がある。語の名前は日本語だけで、URI は http://imi.go.jp/ns/core/rdf# に名前を続けたもの。GIF（gif データセット）のコアデータモデルは、多くの項目でこの語彙を参考元にしている。
published: true
sources:
  - path: https://imi.go.jp/core/core242/
fields:
