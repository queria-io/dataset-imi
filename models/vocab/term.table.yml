schema: vocab
name: term
title: コア語彙の語
description: |-
  IMI コア語彙 2.4.2 の語です。1 行が 1 語で、クラス（住所型など「〜型」）とプロパティ（住所、緯度など）があります。

  - 語の URI は http://imi.go.jp/ns/core/rdf# に名前を続けたものです
sources:
  - path: https://imi.go.jp/core/core242/
fields:
  - name: version
    title: バージョン
  - name: uri
    title: URI
  - name: name
    title: 語
    description: URI の名前の部分。ic:住所型 の 住所型
  - name: kind
    title: 種類
    description: class・property・datatype。それ以外は RDF の型の URI
  - name: deprecated
    title: 非推奨
    description: 非推奨になった語なら true
  - name: label_ja
    title: ラベル
  - name: label_en
    title: ラベル（英語）
    description: 英語のラベルがある語だけ
  - name: description
    title: 説明
  - name: parent
    title: 上位の語
    description: "上位のクラスまたはプロパティ。複数のときは | 区切り"
  - name: domain
    title: 定義域
    description: このプロパティを持つクラス。複数のときは | 区切り
  - name: range
    title: 値域
    description: このプロパティの値の型。複数のときは | 区切り
