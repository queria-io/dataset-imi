    title: 版
  - name: uri
    title: URI
  - name: name
    title: 語
    description: URI の名前の部分。ic:住所型 の 住所型
  - name: kind
    title: 種類
    description: class か property。RDF の型がそれ以外のときは型の URI をそのまま入れる。複数あるときは | でつなぐ
  - name: label_ja
    title: ラベル
  - name: label_en
    title: ラベル（英語）
    description: 英語のラベルがある語だけ。コア語彙の多くの語には無い
  - name: description
    title: 説明
  - name: parent
    title: 上位の語
    description: "上位のクラス（rdfs:subClassOf）またはプロパティ（rdfs:subPropertyOf）。ic: で始まる短い形。複数あるときは | でつなぐ"
  - name: domain
    title: 定義域
    description: このプロパティを持つクラス。複数あるときは | でつなぐ
  - name: range
    title: 値域
    description: このプロパティの値の型。複数あるときは | でつなぐ
